<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF8F5; }
      .border-line { stroke: #E7E5E4; stroke-width: 1.5; fill: none; }
      .grid-line { stroke: #F5F5F4; stroke-width: 1; }
      .accent-line { stroke: #7F1D1D; stroke-width: 2; fill: none; }
      .title { font-family: "Georgia", serif; font-size: 22px; font-weight: bold; fill: #1C1917; }
      .subtitle { font-family: "Inter", sans-serif; font-size: 11px; font-weight: 600; fill: #78716C; letter-spacing: 1.5px; }
      .label-large { font-family: "Georgia", serif; font-size: 16px; font-weight: bold; fill: #1C1917; }
      .body-text { font-family: "Inter", sans-serif; font-size: 12px; fill: #44403C; }
      .mono-text { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #78716C; }
      .box-bg { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1; }
      .box-bg-highlight { fill: #FFFDFB; stroke: #7F1D1D; stroke-width: 1.5; }
      .weight-box { stroke: #D6D3D1; stroke-width: 1; fill: #FFFFFF; }
      .weight-text-number { font-family: "Georgia", serif; font-size: 32px; font-weight: bold; fill: #7F1D1D; }
      .weight-text-label { font-family: "Inter", sans-serif; font-size: 10.5px; font-weight: bold; fill: #78716C; letter-spacing: 0.5px; }
      .range-bar { height: 18px; stroke-width: 1; stroke: #D6D3D1; }
      .tag-pre { fill: #F5F5F4; stroke: #E7E5E4; }
      .tag-sig { fill: #FEF3C7; stroke: #F59E0B; }
      .tag-trans { fill: #FFF7ED; stroke: #F97316; }
      .tag-mature { fill: #FEF2F2; stroke: #EF4444; }
      .tag-lbl { font-family: "Inter", sans-serif; font-size: 11px; font-weight: bold; fill: #1C1917; }
    </style>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" class="bg" />
  <line x1="100" y1="0" x2="100" y2="600" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="600" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="600" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="600" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="600" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="600" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="600" class="grid-line" />
  <line x1="0" y1="100" x2="800" y2="100" class="grid-line" />
  <line x1="0" y1="200" x2="800" y2="200" class="grid-line" />
  <line x1="0" y1="300" x2="800" y2="300" class="grid-line" />
  <line x1="0" y1="400" x2="800" y2="400" class="grid-line" />
  <line x1="0" y1="500" x2="800" y2="500" class="grid-line" />

  <!-- Outer Frame -->
  <rect x="25" y="25" width="750" height="550" class="border-line" />

  <!-- Header -->
  <text x="50" y="65" class="title">Architect Readiness Index (ARI) Mathematical Modeling</text>
  <text x="50" y="85" class="subtitle">UNIVERSAL CO-EFFICIENT AND SYSTEM SEGMENTATION EQUATIONS</text>
  <line x1="50" y1="95" x2="750" y2="95" class="accent-line" />

  <!-- Master Equation Box -->
  <g transform="translate(50, 115)">
    <rect width="700" height="90" class="box-bg-highlight" />
    <text x="25" y="32" class="mono-text" font-weight="bold" fill="#7F1D1D" style="font-size: 11px;">MASTER FORMULA</text>
    <text x="25" y="58" font-family="Georgia, serif" font-size="20px" font-weight="bold" fill="#1C1917">
      ARI = (GSV × 0.35) + (ITC × 0.35) + (Dynamics × 0.20) + (AFL × 0.10)
    </text>
    <text x="495" y="32" class="mono-text">Calculates system capacity score [0.00 – 10.00]</text>
  </g>

  <!-- Weight Breakdown Graphic Grid -->
  <g transform="translate(50, 225)">
    <text x="0" y="20" class="label-large">1. Matrix Component Weighting Proportions</text>
    
    <!-- GSV Block -->
    <g transform="translate(0, 35)">
      <rect width="165" height="110" class="weight-box" />
      <path d="M 0 0 L 165 0" stroke="#7F1D1D" stroke-width="2" />
      <text x="20" y="35" class="weight-text-label">PILLAR I (GSV)</text>
      <text x="20" y="70" class="weight-text-number">35%</text>
      <text x="20" y="93" class="mono-text">Grassroots Viability</text>
    </g>

    <!-- ITC Block -->
    <g transform="translate(180, 35)">
      <rect width="165" height="110" class="weight-box" />
      <path d="M 0 0 L 165 0" stroke="#7F1D1D" stroke-width="2" />
      <text x="20" y="35" class="weight-text-label">PILLAR II (ITC)</text>
      <text x="20" y="70" class="weight-text-number">35%</text>
      <text x="20" y="93" class="mono-text">Institutional Capacity</text>
    </g>

    <!-- Dynamics Block -->
    <g transform="translate(360, 35)">
      <rect width="165" height="110" class="weight-box" />
      <path d="M 0 0 L 165 0" stroke="#78716C" stroke-width="2" />
      <text x="20" y="35" class="weight-text-label">PILLAR III (DYNAMICS)</text>
      <text x="20" y="70" class="weight-text-number" style="fill: #1C1917;">20%</text>
      <text x="20" y="93" class="mono-text">LIC &amp; Momentum</text>
    </g>

    <!-- AFL Block -->
    <g transform="translate(540, 35)">
      <rect width="160" height="110" class="weight-box" />
      <path d="M 0 0 L 160 0" stroke="#78716C" stroke-width="2" />
      <text x="15" y="35" class="weight-text-label">PILLAR IV (AFL)</text>
      <text x="15" y="70" class="weight-text-number" style="fill: #1C1917;">10%</text>
      <text x="15" y="93" class="mono-text">Feasibility Space</text>
    </g>
  </g>

  <!-- Interpretation Matrix Section -->
  <g transform="translate(50, 400)">
    <text x="0" y="20" class="label-large">2. Core Index Interpretation Zones</text>
    
    <!-- 0.0 - 3.0 Pre-Emergent -->
    <g transform="translate(0, 33)">
      <rect width="160" height="90" class="tag-pre" />
      <text x="15" y="25" class="tag-lbl">0.0 – 3.0</text>
      <text x="15" y="42" font-family="Georgia, serif" font-size="12px" font-weight="bold" fill="#44403C">Pre-Emergent</text>
      <text x="15" y="60" class="body-text" style="font-size: 10.5px; fill: #57534E;">Infrastructure is absent.</text>
      <text x="15" y="75" class="body-text" style="font-size: 10.5px; fill: #57534E;">Capital is stranded.</text>
    </g>

    <!-- 3.0 - 5.0 SIG -->
    <g transform="translate(178, 33)">
      <rect width="165" height="90" class="box-bg" style="fill: #FEF3C7; stroke: #D97706; stroke-width: 1.5;" />
      <text x="15" y="25" class="tag-lbl" style="fill: #B45309;">3.0 – 5.0</text>
      <text x="15" y="42" font-family="Georgia, serif" font-size="12px" font-weight="bold" fill="#92400E">Structural Gap (SIG)</text>
      <text x="15" y="60" class="body-text" style="font-size: 10.5px; fill: #B45309;">Translation deficit.</text>
      <text x="15" y="75" class="body-text" style="font-size: 10.5px; fill: #B45309;">Bridge builds mandatory.</text>
    </g>

    <!-- 5.0 - 7.0 Transitional -->
    <g transform="translate(360, 33)">
      <rect width="165" height="90" class="tag-trans" />
      <text x="15" y="25" class="tag-lbl" style="fill: #C2410C;">5.0 – 7.0</text>
      <text x="15" y="42" font-family="Georgia, serif" font-size="12px" font-weight="bold" fill="#9A3412">Transitional Market</text>
      <text x="15" y="60" class="body-text" style="font-size: 10.5px; fill: #7C2D12;">Formation has begun.</text>
      <text x="15" y="75" class="body-text" style="font-size: 10.5px; fill: #7C2D12;">Accelerate maturity.</text>
    </g>

    <!-- 7.0 - 10.0 Mature -->
    <g transform="translate(540, 33)">
      <rect width="160" height="90" class="tag-mature" />
      <text x="15" y="25" class="tag-lbl" style="fill: #991B1B;">7.0 – 10.0</text>
      <text x="15" y="42" font-family="Georgia, serif" font-size="12px" font-weight="bold" fill="#7F1D1D">Mature Ecosystem</text>
      <text x="15" y="60" class="body-text" style="font-size: 10.5px; fill: #991B1B;">Legible pathways.</text>
      <text x="15" y="75" class="body-text" style="font-size: 10.5px; fill: #991B1B;">Deploy standard models.</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="50" y="565" class="mono-text">Country Architect Diagnostic v2.2 Weight Model | JEL Classification: O10, O16, O17 • Prepared by Abeselom Girum Chernet</text>
</svg>
